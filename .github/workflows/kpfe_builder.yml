name: Build "turnip" KPFE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
  # Auto-build on pushes to the KPFE development branches (version 0.<run number>)
  push:
    branches:
      - claude/qualcomm-8xx-kpfe-drivers-yscmsa
      - claude/pocket-fit-elite-perf-ai9wi2

jobs:
  build_kpfe_turnip:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BUILD_VERSION: ${{ inputs.version || format('0.{0}', github.run_number) }}
      BUILD_TARGETS: turnip-gen8-kpfe turnip-gen8-kpfe-gmem
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Prepare environment
      run: |
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update
        sudo apt install build-essential flex bison glslang-tools
        sudo apt install meson-1.5

    - name: Execute build script
      run: bash ./turnip_builder.sh

    - name: Release "turnip" KPFE
      uses: softprops/action-gh-release@v1
      with:
        body: |
          KPFE Turnip Vulkan V${{ env.BUILD_VERSION }} — stability build for the KONKR Pocket Fit Elite
          Built from: https://github.com/whitebelyash/mesa-unified (turnip/gen8 branch)

          Target hardware: AYANEO KONKR Pocket Fit Elite — Snapdragon 8 Elite, **Adreno 830** (KGSL chip id `0x44050001`), Android 16.

          What's different from the generic A8XX builds:
          * **Sysmem rendering forced on A830.** GMEM (tiled) rendering causes write page faults and a glitchy picture on Adreno 830; this build disables it at the device level, so you don't need to set `TU_DEBUG=sysmem` in every app. Power users can re-enable GMEM for testing with `FD_DEV_FEATURES=disable_gmem=0`.
          * **KGSL timeline sync** (Mesa MR !39751) included — probes the kernel at runtime and falls back to legacy syncobj if unsupported, improving semaphore handling for emulators.
          * Fixed a broken A830 chip-id check that incorrectly applied A8XX shader workarounds to every GPU.
          * **On-disk shader cache enabled on Android** (both zips): Mesa normally never caches compiled shaders inside Android app sandboxes, so every emulator session recompiled everything. The driver now caches into the host app's own cache directory — the first run of a game still compiles shaders, later runs mostly don't. Disable with `MESA_SHADER_CACHE_DISABLE=true` if it misbehaves.
          * Built with `-Db_ndebug=true` so stray driver asserts can't abort your game.

          Two zips are attached:
          * `a8xx-turnip-gen8-kpfe` — **stable**: sysmem rendering forced on A830 (the build described above). Also works on other A8XX devices.
          * `a8xx-turnip-gen8-kpfe-gmem` — **GMEM experiment, KPFE ONLY**: GMEM (tiled) rendering stays enabled, with retuned CCU cache windows (A825/A829-style instead of the oversized a8xx_gen1 defaults suspected of causing the write page faults). The sysmem depth-cache window is shrunk the same way, which may also help sysmem artifacts (e.g. TOTK black-square flashes). Compiled with `-mcpu=oryon-1`, so it can crash on non-Snapdragon-8-Elite SoCs. Expect the best performance in Eden and native games if it works; please report faults/glitches. See docs/KPFE.md for the runtime tuning knobs (`FD_DEV_FEATURES`).

          Notes:
          * Install with an AdrenoTools-compatible app/emulator (see repo README).
          * Some games refuse to run on Qualcomm GPUs — spoof as Steam Deck with `TU_DEBUG=deck_emu`.
          * Disable DXVK_HUD if you see weird black artifacts.

          >[!WARNING]
          > Please don't report issues to Mesa, PLEASE

        tag_name: kpfe_v${{ env.BUILD_VERSION }}
        name: Turnip KPFE v${{ env.BUILD_VERSION }}
        files: |
           /tmp/a8xx-turnip-gen8-kpfe-V${{ env.BUILD_VERSION }}.zip
           /tmp/a8xx-turnip-gen8-kpfe-gmem-V${{ env.BUILD_VERSION }}.zip
